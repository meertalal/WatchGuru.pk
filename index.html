<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WatchGuru.pk — Pakistan’s home for 100% original luxury watches. Authorised maisons, insured nationwide delivery, Cash on Delivery and a 1-year machine warranty on every piece."
    />
    <meta name="theme-color" content="#050708" />

    <!-- Open Graph / Twitter defaults (pages override title & description at runtime) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WatchGuru.pk" />
    <meta property="og:title" content="WatchGuru.pk — Fine Luxury Watches" />
    <meta

      content="100% original luxury watches — authorised sourcing, insured delivery across Pakistan, Cash on Delivery."
    />
    <meta property="og:image" content="https://www.watchguru.pk/og.png" />
    <meta property="og:url" content="https://www.watchguru.pk/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Serif+Display&family=Inter:wght@300;400;500&family=Lato&family=Lora&family=Playfair+Display:wght@400&display=swap"
      rel="stylesheet"

    <!-- Structured data: the store itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "JewelryStore",
      "name": "WatchGuru.pk",

      "telephone": "+923222242389",
      "description": "Pakistan’s home for 100% original luxury watches — authorised maisons, insured nationwide delivery, Cash on Delivery.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Karachi",
        "addressRegion": "Sindh",
        "addressCountry": "PK"
      },
      "openingHours": "Mo-Sa 09:00-21:00",
      "priceRange": "Rs. 500,000 – Rs. 7,600,000",
      "currenciesAccepted": "PKR",
      "paymentAccepted": "Cash on Delivery, Bank Transfer, Easypaisa, JazzCash"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WatchGuru.pk",
      "url": "https://www.watchguru.pk",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.watchguru.pk/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <title>WatchGuru.pk — Buy 100% Original Luxury Watches Online in Pakistan</title>

    <div id="root"></div>
